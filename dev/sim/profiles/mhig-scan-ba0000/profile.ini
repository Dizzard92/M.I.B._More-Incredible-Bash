# Like mhig, but WITHOUT the flashlock tool: apps/offset scans the flash for the IFS magic bytes.
# Reproduces the offset case mismatch (scan yields BA0000, MHIG_patch_db.csv has ba0000).
# MHIG unit (MIB1 High, MIBMO=3). The ifs-root version 9999 is fictional: mibsim appends a matching
# row to patches/MHIG_patch_db.csv in the simulated SD card so the live-patch path can succeed.
[unit]
model = mhig
train = MHIG_EU_AU_K1553
mu = 1553
ifs_version = 9999
fazit = SIMFAZIT-0000-000000004
vin = WAUZZZSIMULATED02
partno = 4M0035043A
component = MHIG-EU-AU
dataset = 4M003504301
hwno = H13
variant = FMU-H-EU-AU
coding = 01157600000000000000000000000000000000000000000000
free_ram_mb = 300

[flash]
size_mib = 32
stage2_offset = ba0000
stage2_header = D41B3F00
flashlock = no

[persistence]
udp.0:3221422082 = 06 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00
